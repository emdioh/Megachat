# =============================================================================
# megachatd — Go server: vet + test, then static Linux binaries (CGO_ENABLED=0)
#
# Trigger : push to master / claude/** / worker/** touching megachatd/,
#           pull_request touching megachatd/, tag `megachatd-v*`, manual run.
# Output  : artifacts megachatd-linux-amd64 and megachatd-linux-arm64 (fully
#           static, run on glibc and musl/Alpine alike) + SHA256SUMS.
#           A `megachatd-v*` tag also publishes them as a GitHub release.
# =============================================================================

name: megachatd

on:
  push:
    branches: [master, "claude/**", "worker/**"]
    paths: ["megachatd/**", ".github/workflows/megachatd.yml"]
    tags: ["megachatd-v*"]
  pull_request:
    paths: ["megachatd/**", ".github/workflows/megachatd.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: megachatd

jobs:
  test:
    name: Vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: megachatd/go.mod
          cache-dependency-path: megachatd/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

  build:
    name: Build linux/${{ matrix.goarch }} (static)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: megachatd/go.mod
          cache-dependency-path: megachatd/go.sum

      - name: Build
        run: |
          ldflags="-s -w"
          # Tagged builds report the tag's version; others keep main.Version.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ldflags="$ldflags -X main.Version=${GITHUB_REF_NAME#megachatd-v}"
          fi
          go build -trimpath -ldflags="$ldflags" \
            -o "bin/megachatd-linux-${GOARCH}" ./cmd/megachatd

      - name: Verify static binary
        run: |
          f="bin/megachatd-linux-${GOARCH}"
          file "$f"
          file "$f" | grep -q "statically linked"
          if [ "$GOARCH" = amd64 ]; then "$f" version; fi

      - uses: actions/upload-artifact@v7
        with:
          name: megachatd-linux-${{ matrix.goarch }}
          path: megachatd/bin/megachatd-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: megachatd-linux-*
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum megachatd-linux-* > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Static Linux builds of megachatd (CGO_ENABLED=0, amd64 + arm64; run on Alpine/musl too)."
